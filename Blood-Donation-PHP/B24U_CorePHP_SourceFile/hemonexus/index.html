<body class="font-sans antialiased min-h-screen">
  <div id="root"></div>

  <!-- Main Security & Presentation Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. FULL-STACK SECURITY SESSION BRIDGE
    // ==========================================
    class HemoNexusSecurityBridge {
      /**
       * Asynchronously checks active backend $_SESSION state
       * Returns: { authenticated: boolean, role: 'donor'|'organizer'|null, session_id: string, pendingOtp: string|null, user: object|null }
       */
      static async verifySession() {
        try {
          const res = await fetch('../auth_status.php', {
            credentials: 'include',
            headers: { 'Cache-Control': 'no-cache' }
          });
          if (res.ok) {
            return await res.json();
          }
        } catch (e) {
          console.warn('[Security Bridge] Error querying auth_status.php:', e);
        }
        return { authenticated: false, role: null, session_id: null, pendingOtp: null, user: null };
      }

      /**
       * Executes an application/x-www-form-urlencoded POST dispatch
       * to ensure 100% native compatibility with PHP $_POST superglobal.
       */
      static async postLegacy(endpoint, data) {
        const searchParams = new URLSearchParams();
        Object.entries(data).forEach(([key, val]) => {
          if (val !== undefined && val !== null) {
            searchParams.append(key, val.toString());
          }
        });

        const res = await fetch(`../${endpoint}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
          },
          body: searchParams.toString(),
          credentials: 'include'
        });

        const html = await res.text();
        const alertMatch = html.match(/alert\(['"]([^'"]+)['"]\)/i);
        const locMatch = html.match(/window\.location\s*=\s*['"]([^'"]+)['"]/i);
        const msg = alertMatch ? alertMatch[1] : '';
        const lowerMsg = msg.toLowerCase();
        const isError = lowerMsg.includes('error') || lowerMsg.includes('invalid') || lowerMsg.includes('does not match') || lowerMsg.includes('already registered');

        return {
          success: !isError && (msg.length > 0 || locMatch !== null),
          message: msg || (isError ? 'Action rejected' : 'Operation recorded'),
          redirectTarget: locMatch ? locMatch[1].trim() : null,
          rawHtml: html
        };
      }

      /**
       * Authenticates Donor against legacy login_donor.php
       */
      static async authenticateDonor(username, password) {
        return this.postLegacy('login_donor.php', {
          user_name: username,
          password: password,
          submit: 'Login'
        });
      }

      /**
       * Authenticates Event Organizer against legacy login_event.php
       */
      static async authenticateOrganizer(email, password) {
        return this.postLegacy('login_event.php', {
          user_email: email,
          password: password,
          submit: 'Login'
        });
      }

      /**
       * Flushes backend session completely via signout_donor.php or signout_event.php
       */
      static async flushSession(role) {
        const endpoint = role === 'organizer' ? '../signout_event.php' : '../signout_donor.php';
        try {
          await fetch(endpoint, { credentials: 'include' });
        } catch (e) {
          console.warn('[Security Bridge] Error calling logout endpoint:', e);
        }
        // Purge client storage caches
        sessionStorage.clear();
        localStorage.removeItem('hemonexus_user_cache');
      }

      /**
       * Fetches dynamic records from b24u database via data_api.php
       */
      static async fetchDynamicData(action, params = {}) {
        const qs = new URLSearchParams({ action, ...params }).toString();
        try {
          const res = await fetch(`../data_api.php?${qs}`, {
            credentials: 'include',
            headers: { 'Cache-Control': 'no-cache' }
          });
          if (res.ok) return await res.json();
        } catch (e) {
          console.warn(`[Data Bridge] Error loading data_api.php?action=${action}:`, e);
        }
        return { success: false };
      }
    }

    // ==========================================
    // 2. REUSABLE UI PRIMITIVES
    // ==========================================
    function TelemetryGauge({ label, value, unit, status = 'optimal', color = '#00E5FF' }) {
      return (
        <div className="glass-card p-5 relative overflow-hidden group">
          <div 
            className="absolute -right-6 -bottom-6 w-24 h-24 rounded-full blur-2xl opacity-10 pointer-events-none transition-opacity group-hover:opacity-25"
            style={{ backgroundColor: color }}
          />
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs uppercase tracking-wider text-slate-400 font-mono font-semibold">
              {label}
            </span>
            <span 
              className="text-[10px] font-mono px-2 py-0.5 rounded-full border uppercase"
              style={{ borderColor: `${color}40`, color: color, backgroundColor: `${color}10` }}
            >
              {status}
            </span>
          </div>
          <div className="flex items-baseline gap-2">
            <span className="text-3xl font-bold font-mono tracking-tight text-white">{value}</span>
            <span className="text-xs font-mono text-slate-500">{unit}</span>
          </div>
          <div className="mt-4 h-1.5 w-full bg-slate-900 rounded-full overflow-hidden border border-white/5">
            <div 
              className="h-full rounded-full transition-all duration-700 ease-out"
              style={{ backgroundColor: color, width: '75%', boxShadow: `0 0 8px ${color}80` }}
            />
          </div>
        </div>
      );
    }

    function BloodBadge({ type, isUrgent = false }) {
      return (
        <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-lg font-mono font-bold text-xs border ${
          isUrgent 
            ? 'bg-red-950/60 border-red-500 text-red-300 shadow-[0_0_12px_rgba(230,57,70,0.35)]' 
            : 'bg-slate-900 border-cyan-500/30 text-cyan-400 shadow-[0_0_8px_rgba(0,229,255,0.15)]'
        }`}>
          <span className="w-1.5 h-1.5 rounded-full bg-current" />
          <span>{type}</span>
        </span>
      );
    }

    // ==========================================
    // 3. MASTER APPLICATION & NAVIGATION GUARD
    // ==========================================
    function App() {
      // Current Route View
      const [view, setView] = useState('home');

      // Security Session State
      const [session, setSession] = useState({
        checking: true,
        authenticated: false,
        role: null, // 'donor' | 'organizer' | null
        sessionId: null,
        user: null,
      });

      // Navigation Guard & Security Notices
      const [securityNotice, setSecurityNotice] = useState(null); // { type: 'warning'|'violation'|'success', title, message, intendedRoute }

      // Form State for Stepper
      const [step, setStep] = useState(1);
      const [stepperLoading, setStepperLoading] = useState(false);
      const [stepperErr, setStepperErr] = useState(null);
      const [stepperMsg, setStepperMsg] = useState(null);
      const [formData, setFormData] = useState({
        user_name: '',
        password: '',
        confirm_password: '',
        user_full_name: '',
        user_email: '',
        user_number: '',
        date_of_birth: '1998-05-15',
        gender: 'Male',
        blood_group: 'O+',
        weight: '68',
        Address: 'Ellisbridge Area',
        city: 'Ahmedabad',
        state: 'Gujarat',
        pincode: '380006'
      });
      const [otpInput, setOtpInput] = useState(['', '', '', '']);

      // Login Gateway States
      const [donorLoginUser, setDonorLoginUser] = useState('');
      const [donorLoginPass, setDonorLoginPass] = useState('');
      const [donorLoginLoading, setDonorLoginLoading] = useState(false);
      const [donorLoginErr, setDonorLoginErr] = useState(null);

      const [orgLoginEmail, setOrgLoginEmail] = useState('');
      const [orgLoginPass, setOrgLoginPass] = useState('');
      const [orgLoginLoading, setOrgLoginLoading] = useState(false);
      const [orgLoginErr, setOrgLoginErr] = useState(null);

      // Kiosk & Blood Request States (Dynamic Database Synced)
      const [requests, setRequests] = useState([]);
      const [campAttendees, setCampAttendees] = useState([]);
      const [donorHistoryList, setDonorHistoryList] = useState([]);
      const [pendingOtpHint, setPendingOtpHint] = useState(null);
      const [donorLookupResult, setDonorLookupResult] = useState(null);
      const [donorLookupLoading, setDonorLookupLoading] = useState(false);

      const [kioskDonorId, setKioskDonorId] = useState('');
      const [kioskWeight, setKioskWeight] = useState('65');
      const [kioskBP, setKioskBP] = useState('120/80');
      const [kioskPulse, setKioskPulse] = useState('74');
      const [kioskHb, setKioskHb] = useState('14.0');
      const [kioskNeed, setKioskNeed] = useState('Blood');
      const [kioskMsg, setKioskMsg] = useState(null);

      // Emergency Blood Form
      const [reqPatient, setReqPatient] = useState('');
      const [reqHospital, setReqHospital] = useState('');
      const [reqBlood, setReqBlood] = useState('O+');
      const [reqDate, setReqDate] = useState(new Date().toISOString().split('T')[0]);
      const [reqPhone, setReqPhone] = useState('');
      const [reqSuccess, setReqSuccess] = useState(false);

      // ==========================================
      // ROUTE GUARD ENGINE
      // ==========================================
      const navigateWithGuard = (targetView, currentSession = session) => {
        setSecurityNotice(null);

        const donorProtectedRoutes = ['donor-dashboard', 'donor-history', 'donor-health', 'donor-requests'];
        const organizerProtectedRoutes = ['event-dashboard', 'camp-kiosk', 'camp-roster', 'camp-overview'];
        const guestOnlyRoutes = ['donor-login', 'organizer-login', 'donor-stepper'];

        // Guard 1: Donor Protected Workspaces
        if (donorProtectedRoutes.includes(targetView)) {
          if (!currentSession.authenticated) {
            setSecurityNotice({
              type: 'warning',
              title: '🔒 Terminal Access Restricted',
              message: 'Authentication required. An active verified Donor session is required to access the Donor Terminal. Please authenticate below.',
              intendedRoute: targetView
            });
            setView('donor-login');
            return false;
          }
          if (currentSession.role !== 'donor') {
            setSecurityNotice({
              type: 'violation',
              title: '⛔ Workspace Isolation Policy Violation',
              message: 'Strict Isolation Guard: Event Organizers are prevented from accessing the Donor Terminal workspace. Redirected to Camp Command.',
              intendedRoute: null
            });
            setView('event-dashboard');
            return false;
          }
        }

        // Guard 2: Organizer Protected Workspaces
        if (organizerProtectedRoutes.includes(targetView)) {
          if (!currentSession.authenticated) {
            setSecurityNotice({
              type: 'warning',
              title: '🔒 Camp Command Restricted',
              message: 'Authentication required. Certified Event Organizer credentials are required to access Camp Command. Please authenticate below.',
              intendedRoute: targetView
            });
            setView('organizer-login');
            return false;
          }
          if (currentSession.role !== 'organizer') {
            setSecurityNotice({
              type: 'violation',
              title: '⛔ Workspace Isolation Policy Violation',
              message: 'Strict Isolation Guard: Registered Donors are prevented from entering the Event Organizer Command Center. Redirected to Donor Terminal.',
              intendedRoute: null
            });
            setView('donor-dashboard');
            return false;
          }
        }

        // Guard 3: Guest-only Gateways (redirect to authorized dashboard if already authenticated)
        if (guestOnlyRoutes.includes(targetView) && currentSession.authenticated) {
          if (currentSession.role === 'donor') {
            setView('donor-dashboard');
            return false;
          }
          if (currentSession.role === 'organizer') {
            setView('event-dashboard');
            return false;
          }
        }

        setView(targetView);
        return true;
      };

      // ==========================================
      // SESSION SYNCHRONIZATION & DYNAMIC DATA ENGINE
      // ==========================================
      const refreshLiveDatabaseData = async (activeRole = session.role) => {
        // 1. Fetch unfulfilled emergency blood requests from requestblood
        const reqData = await HemoNexusSecurityBridge.fetchDynamicData('requests');
        if (reqData && reqData.success && Array.isArray(reqData.requests)) {
          setRequests(reqData.requests);
        }

        // 2. If Donor, fetch personal history and fresh vitals from b24u
        if (activeRole === 'donor') {
          const histData = await HemoNexusSecurityBridge.fetchDynamicData('donor_history');
          if (histData && histData.success && Array.isArray(histData.history)) {
            setDonorHistoryList(histData.history);
          }
          const vitalsData = await HemoNexusSecurityBridge.fetchDynamicData('donor_vitals');
          if (vitalsData && vitalsData.success && vitalsData.vitals) {
            setSession(prev => ({
              ...prev,
              user: {
                ...prev.user,
                weight: vitalsData.vitals.weight,
                bloodPressure: vitalsData.vitals.bloodPressure,
                pulse: vitalsData.vitals.pulse,
                hemoglobin: vitalsData.vitals.hemoglobin,
                totalDonation: vitalsData.vitals.totalDonation,
                healthReport: vitalsData.vitals.healthReport
              }
            }));
          }
        }

        // 3. If Organizer, fetch live camp roster from b24u
        if (activeRole === 'organizer') {
          const rosterData = await HemoNexusSecurityBridge.fetchDynamicData('camp_roster');
          if (rosterData && rosterData.success && Array.isArray(rosterData.attendees)) {
            setCampAttendees(rosterData.attendees);
          }
        }
      };

      const refreshSessionState = async () => {
        const authData = await HemoNexusSecurityBridge.verifySession();
        setSession({
          checking: false,
          authenticated: authData.authenticated,
          role: authData.role,
          sessionId: authData.session_id,
          user: authData.user
        });
        if (authData.pendingOtp) {
          setPendingOtpHint(authData.pendingOtp);
        }
        return authData;
      };

      // Boot session sync & dynamic database hydration
      useEffect(() => {
        refreshSessionState().then(auth => {
          refreshLiveDatabaseData(auth.role);
          // If on root and already authenticated, route directly to workspace
          if (auth.authenticated) {
            if (auth.role === 'donor') setView('donor-dashboard');
            else if (auth.role === 'organizer') setView('event-dashboard');
          }
        });

        // Background session watchdog heartbeat every 45s
        const interval = setInterval(async () => {
          const auth = await HemoNexusSecurityBridge.verifySession();
          setSession(prev => {
            // Detect session timeout
            if (prev.authenticated && !auth.authenticated) {
              setSecurityNotice({
                type: 'warning',
                title: '⌛ Session Expired',
                message: 'Your authenticated session has expired on the server. Please sign in again.',
                intendedRoute: 'home'
              });
              setView('home');
            }
            return {
              checking: false,
              authenticated: auth.authenticated,
              role: auth.role,
              sessionId: auth.session_id,
              user: auth.user
            };
          });
        }, 45000);

        return () => clearInterval(interval);
      }, []);

      // ==========================================
      // AUTHENTICATION & DISPATCH HANDLERS
      // ==========================================
      const handleDonorLoginSubmit = async (e) => {
        e.preventDefault();
        setDonorLoginLoading(true);
        setDonorLoginErr(null);

        const res = await HemoNexusSecurityBridge.authenticateDonor(donorLoginUser, donorLoginPass);
        setDonorLoginLoading(false);

        if (res.success) {
          const updated = await refreshSessionState();
          await refreshLiveDatabaseData('donor');
          const target = (securityNotice && securityNotice.intendedRoute) ? securityNotice.intendedRoute : 'donor-dashboard';
          setSecurityNotice({
            type: 'success',
            title: '✅ Terminal Handshake Verified',
            message: `Welcome, ${updated.user ? updated.user.userFullName : donorLoginUser}. Authenticated session token issued.`,
            intendedRoute: null
          });
          navigateWithGuard(target, updated);
        } else {
          setDonorLoginErr(res.message);
        }
      };

      const handleOrgLoginSubmit = async (e) => {
        e.preventDefault();
        setOrgLoginLoading(true);
        setOrgLoginErr(null);

        const res = await HemoNexusSecurityBridge.authenticateOrganizer(orgLoginEmail, orgLoginPass);
        setOrgLoginLoading(false);

        if (res.success) {
          const updated = await refreshSessionState();
          await refreshLiveDatabaseData('organizer');
          const target = (securityNotice && securityNotice.intendedRoute) ? securityNotice.intendedRoute : 'event-dashboard';
          setSecurityNotice({
            type: 'success',
            title: '✅ Camp Authorization Verified',
            message: `Welcome, ${updated.user ? updated.user.userFullName : orgLoginEmail}. Camp Organizer session hydrated.`,
            intendedRoute: null
          });
          navigateWithGuard(target, updated);
        } else {
          setOrgLoginErr(res.message);
        }
      };

      const handleLogout = async () => {
        const currentRole = session.role;
        await HemoNexusSecurityBridge.flushSession(currentRole);
        await refreshSessionState();
        setSecurityNotice({
          type: 'success',
          title: '🛡️ Session Securely Terminated',
          message: 'Server-side session destroyed and client biometric buffers flushed.',
          intendedRoute: null
        });
        setView('home');
      };

      // Registration Stepper Actions (process.php & otp_form.php)
      const handleRegisterStep1 = () => {
        if (!formData.user_name || formData.user_name.length < 5) {
          setStepperErr('Username must be between 5 and 10 characters.');
          return;
        }
        if (formData.password !== formData.confirm_password || formData.password.length < 6) {
          setStepperErr('Passwords must match and contain at least 6 characters.');
          return;
        }
        setStepperErr(null);
        setStep(2);
      };

      const handleRegisterStep2 = () => {
        if (!formData.user_full_name || !formData.user_email || formData.user_number.length !== 10) {
          setStepperErr('Please complete all contact fields (10-digit emergency phone).');
          return;
        }
        setStepperErr(null);
        setStep(3);
      };

      const handleSendOtp = async () => {
        setStepperLoading(true);
        setStepperErr(null);
        const res = await HemoNexusSecurityBridge.postLegacy('process.php', { ...formData, submit: 'Submit' });
        setStepperLoading(false);
        if (res.success) {
          const auth = await HemoNexusSecurityBridge.verifySession();
          if (auth.pendingOtp) {
            setPendingOtpHint(auth.pendingOtp);
          }
          setStepperMsg('4-digit Bio-Verification OTP transmitted to registered contact.');
          setStep(4);
        } else {
          setStepperErr(res.message || 'Error transmitting registration request to process.php');
        }
      };

      const handleResendOtp = async () => {
        setStepperLoading(true);
        setStepperErr(null);
        const res = await HemoNexusSecurityBridge.postLegacy('process.php', { submit: 'Resend' });
        setStepperLoading(false);
        const auth = await HemoNexusSecurityBridge.verifySession();
        if (auth.pendingOtp) {
          setPendingOtpHint(auth.pendingOtp);
        }
        setStepperMsg('New Bio-Verification OTP dispatched.');
      };

      const handleVerifyOtp = async () => {
        const code = otpInput.join('');
        if (code.length !== 4) {
          setStepperErr('Please enter the full 4-digit token.');
          return;
        }
        setStepperLoading(true);
        const res = await HemoNexusSecurityBridge.postLegacy('process.php', { otpno: code, submit: 'Sucess' });
        
        if (res.success) {
          // Auto-authenticate with the newly registered credentials
          const loginRes = await HemoNexusSecurityBridge.authenticateDonor(formData.user_name, formData.password);
          setStepperLoading(false);

          if (loginRes.success) {
            const updated = await refreshSessionState();
            await refreshLiveDatabaseData('donor');
            setSecurityNotice({
              type: 'success',
              title: '✨ Biometric Enrollment Complete',
              message: 'Your account has been created and verified. Welcome to the Bio-Grid!',
              intendedRoute: null
            });
            navigateWithGuard('donor-dashboard', updated);
          } else {
            setView('donor-login');
          }
        } else {
          setStepperLoading(false);
          setStepperErr(res.message || 'Invalid validation token.');
        }
      };

      // Organizer Kiosk Lookup & Check-In Handlers
      const handleLookupDonor = async (idToLookup = kioskDonorId) => {
        if (!idToLookup) return;
        setDonorLookupLoading(true);
        setKioskMsg(null);
        const res = await HemoNexusSecurityBridge.fetchDynamicData('donor_lookup', { donor_id: idToLookup });
        setDonorLookupLoading(false);
        if (res && res.success && res.donor) {
          setDonorLookupResult(res.donor);

                  <div className="glass-card p-5">
                    <h4 className="font-bold text-emerald-400 font-mono text-xs uppercase mb-2">Eligibility Threshold</h4>
                    <p className="text-xs text-slate-400 leading-relaxed">Age 18-65. Weight 50+ kg. Hemoglobin 12.5+ g/dL. 90-day interval.</p>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW: SOLIDARITY FUND (PUBLIC) */}
            {view === 'contribute' && (
              <div className="max-w-xl mx-auto py-6 text-center space-y-4">
                <span className="text-xs font-mono uppercase text-red-400">UNESCO Bio-Solidarity Fund</span>
                <h2 className="text-2xl font-bold text-white">Support Mobile Clinical Camps</h2>
                <p className="text-xs text-slate-400">Directly funds sterile collection bags and cold-chain transport.</p>
                <div className="glass-panel p-6 rounded-2xl text-left space-y-3">
                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1">Donor Name</label>
                    <input type="text" placeholder="Full Name" className="glass-input text-xs" />
                  </div>
                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1">Contribution Amount (₹)</label>
                    <input type="number" defaultValue={1000} className="glass-input font-mono text-xs" />
                  </div>
                  <button 
                    onClick={() => alert('Humanitarian pledge recorded to b24u.contribution!')}
                    className="w-full py-2.5 bg-red-600 text-white font-mono text-xs font-bold uppercase rounded-lg"
                  >
                    Confirm Humanitarian Contribution
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* ==========================================
              FOOTER WITH AUDIT & SECURITY TELEMETRY
          ========================================== */}
          <footer className="glass-panel border-t border-white/10 mt-12 py-5 px-4 font-mono text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <span className="text-white font-bold tracking-wider">HEMONEXUS GLOBAL</span>
                <span>•</span>
                <span className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 pulse-cyan inline-block"></span>
                  <span>Port 8000 Core PHP / MariaDB b24u</span>
                </span>
                <span>•</span>
                <span>Session: {session.sessionId ? session.sessionId.substring(0, 8) + '...' : 'Inactive'}</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="px-2 py-0.5 rounded bg-slate-900 border border-white/10 text-[11px] text-slate-400">
                  {session.authenticated ? `ROLE: ${session.role.toUpperCase()}` : 'ANONYMOUS GUEST'}
                </span>
                <span className="text-[11px] text-slate-600">ISBT 128 Certified</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
